<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">
        <label for="First Name">First Name: </label>
        <input type="text" id="First Name" placeholder="Enter your First Name" required> <br><br>
        
        <label for="Last Name">Last Name: </label>
        <input type="text" id="Last Name" placeholder="Enter your Last Name" required> <br><br>

        <label for="DOB">Date of Birth: </label>
        <input type="date" id="DOB" required> <br><br>

        <label for="Phone Number">Phone: </label>
        <input type="tel" id="Phone Number" placeholder="Enter your phone number" required> <br><br>

        <label for="Email">Email: </label>
        <input type="email" id="Email" placeholder="Enter your Email" required> <br><br>

        <label for="Password">Password: </label>
        <input type="password" id="Password" placeholder="Set password" required> <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
<style>
    .form{
        border: 2px solid black;
    }
</style>
